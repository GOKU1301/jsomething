# Server Configuration
server.port=8081

# Database Configuration (PostgreSQL via Supabase Session Pooler - IPv4 compatible)
# Session Pooler (port 5432) - IPv4 compatible, works with Hibernate DDL
spring.datasource.url=jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.lpoxdzkrmbjfjxlqvshj
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

